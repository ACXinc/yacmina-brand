<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders — Yacmina Brand Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <nav class="nav">
    <a href="index.html" class="logo">YAC<span>MINA</span></a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="market.html">Shop</a>
      <a href="admin.html">Admin</a>
      <a href="#" id="logoutLink" style="display:none;">Logout</a>
    </div>
    <button class="menu-toggle" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </nav>
</header>

<!-- LOGIN VIEW -->
<div id="loginView">
  <div class="login-box fade-in">
    <h1>Admin Access</h1>
    <form id="loginForm">
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="Enter admin password">
      </div>
      <button type="submit" class="btn btn-accent btn-full">Login</button>
      <p class="error-msg" id="errorMsg">Incorrect password. Please try again.</p>
    </form>
  </div>
</div>

<!-- ORDERS VIEW -->
<div id="ordersView" style="display:none;">
  <section class="page-header">
    <div class="container admin-header">
      <div>
        <span class="tag">Dashboard</span>
        <h1>Orders</h1>
      </div>
      <span class="count" id="orderCount" style="color: var(--muted); font-size:13px; letter-spacing:1px;"></span>
    </div>
  </section>

  <section class="container admin-layout">
    <div id="ordersList"></div>
  </section>
</div>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom">
      <span>© 2026 Yacmina Brand. All rights reserved.</span>
      <span>Admin Panel</span>
    </div>
  </div>
</footer>

<script src="js/app.js"></script>
<script>
const ADMIN_PASSWORD = 'ademsarra';

function checkAuth() {
  return sessionStorage.getItem(STORAGE_KEYS.ADMIN_AUTH) === 'true';
}

function showOrders() {
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('ordersView').style.display = 'block';
  document.getElementById('logoutLink').style.display = 'block';
  renderOrders();
}

function showLogin() {
  document.getElementById('loginView').style.display = 'block';
  document.getElementById('ordersView').style.display = 'none';
  document.getElementById('logoutLink').style.display = 'none';
}

document.getElementById('loginForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const pass = document.getElementById('password').value;
  if (pass === ADMIN_PASSWORD) {
    sessionStorage.setItem(STORAGE_KEYS.ADMIN_AUTH, 'true');
    showOrders();
  } else {
    document.getElementById('errorMsg').style.display = 'block';
  }
});

document.getElementById('logoutLink').addEventListener('click', (e) => {
  e.preventDefault();
  sessionStorage.removeItem(STORAGE_KEYS.ADMIN_AUTH);
  showLogin();
});

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleString('en-GB', {
    day: '2-digit', month: 'short', year: 'numeric',
    hour: '2-digit', minute: '2-digit'
  });
}

function renderOrders() {
  const orders = getOrders().slice().reverse(); // most recent first
  const list = document.getElementById('ordersList');
  const countEl = document.getElementById('orderCount');

  countEl.textContent = orders.length + (orders.length === 1 ? ' order' : ' orders');

  if (orders.length === 0) {
    list.innerHTML = `
      <div class="empty-state fade-in">
        <h3>No Orders Yet</h3>
        <p>Orders placed through checkout will appear here.</p>
      </div>
    `;
    return;
  }

  list.innerHTML = orders.map(order => {
    const itemsHtml = order.items.map(item => `
      <div class="order-item-row">
        <span>${escapeHtml(item.title)} — Size ${escapeHtml(item.size)} × ${item.qty}</span>
        <span>${formatPrice(item.price * item.qty)}</span>
      </div>
    `).join('');

    return `
      <div class="order-card fade-in">
        <div class="order-card-header">
          <div>
            <h3>${escapeHtml(order.id)}</h3>
            <div class="order-date">${formatDate(order.date)}</div>
          </div>
          <div class="order-total">${formatPrice(order.total)}</div>
        </div>
        <div class="order-details">
          <div>
            <h4>Customer Details</h4>
            <p><strong style="color: var(--text);">${escapeHtml(order.customer.firstName)} ${escapeHtml(order.customer.lastName)}</strong></p>
            <p>${escapeHtml(order.customer.email)}</p>
            <p>${escapeHtml(order.customer.phone)}</p>
            <p>${escapeHtml(order.customer.location)}</p>
            <p>${escapeHtml(order.customer.address)}</p>
          </div>
          <div>
            <h4>Items Purchased</h4>
            ${itemsHtml}
            <div class="summary-row"><span>Subtotal</span><span>${formatPrice(order.subtotal)}</span></div>
            <div class="summary-row"><span>Delivery Fee</span><span>${formatPrice(order.deliveryFee)}</span></div>
            <div class="summary-row total"><span>Total</span><span>${formatPrice(order.total)}</span></div>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

document.addEventListener('DOMContentLoaded', () => {
  if (checkAuth()) {
    showOrders();
  } else {
    showLogin();
  }
});
</script>
</body>
</html>
